{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row">

  <div class="col-md-3">
    <div class="card p-3">
      <h5>Students</h5>
      <h2>{{ students_count }}</h2>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3">
      <h5>Rooms</h5>
      <h2>{{ rooms_count }}</h2>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3">
      <h5>Wardens</h5>
      <h2>{{ wardens_count }}</h2>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card p-3">
      <h5>Complaints</h5>
      <h2>{{ complaints_count }}</h2>
    </div>
  </div>

</div>

<div class="card p-3 text-success">
    <h5>Resolved Complaints</h5>
    <h2>{{ resolved_count }}</h2>
</div>

<div class="card p-3 text-danger">
    <h5>Unresolved Complaints</h5>
    <h2>{{ unresolved_count }}</h2>
</div>

{% endblock %}
