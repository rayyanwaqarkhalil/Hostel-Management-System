{% extends 'base.html' %}

{% block content %}

<h2>Wardens</h2>

<a href="/wardens/add/" class="btn btn-success mb-3">
Add Warden
</a>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Shift</th>
</tr>

{% for w in wardens %}
<tr>
<td>{{ w.id }}</td>
<td>{{ w.name }}</td>
<td>{{ w.phone }}</td>
<td>{{ w.shift_time }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
