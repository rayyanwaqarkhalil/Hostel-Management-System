{% extends 'base.html' %}

{% block content %}

<h2>Rooms</h2>

<a href="/rooms/add/" class="btn btn-success mb-3">
Add Room
</a>

<table class="table table-bordered">

<tr>
<th>ID</th>
<th>Room Number</th>
<th>Capacity</th>
<th>Status</th>
</tr>

{% for r in rooms %}
<tr>
<td>{{ r.id }}</td>
<td>{{ r.room_number }}</td>
<td>{{ r.capacity }}</td>
<td>{{ r.status }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
