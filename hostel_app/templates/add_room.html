{% extends 'base.html' %}

{% block content %}

<h2>Add Room</h2>

<form method="POST">

{% csrf_token %}

<input type="text" name="room_number"
class="form-control mb-2" placeholder="Room Number">

<input type="number" name="capacity"
class="form-control mb-2" placeholder="Capacity">



<select name="warden" class="form-control mb-2">
<option value="">Warden Name</option>

{% for w in wardens %}

<option value="{{ w.id }}">{{ w.name }}</option>
{% endfor %}

</select>

<button class="btn btn-primary">
Save Room
</button>

</form>

{% endblock %}
